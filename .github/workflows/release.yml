# Builds Throat.dmg and attaches it to a GitHub Release whenever a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Signing and notarization are optional. Without the secrets below the app is ad-hoc signed,
# and people who download it must right-click → Open (or allow it in Privacy & Security) the first time.
#   DEVELOPER_ID_P12           base64 of your "Developer ID Application" certificate exported as .p12
#   DEVELOPER_ID_P12_PASSWORD  the .p12 export password
#   NOTARY_APPLE_ID            your Apple ID email
#   NOTARY_TEAM_ID             your 10-character Apple Developer Team ID
#   NOTARY_PASSWORD            an app-specific password from account.apple.com
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        if: env.P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "SIGNING_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Build app
        env:
          UNIVERSAL: "1"
          BUILD_NUMBER: ${{ github.run_number }}
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Build DMG
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Throat-*.dmg --title "Throat ${GITHUB_REF_NAME#v}" --generate-notes
